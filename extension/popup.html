<!doctype html>
<meta charset="utf-8">
<title>Gong Cookie Bridge</title>
<style>
  :root {
    --bg: #12151d; --surface: #171b25; --line: #252a38;
    --text: #e7eaf3; --muted: #8f97ad; --faint: #5f6779;
    --accent: #7c6cf5; --ok: #48c78e; --bad: #ef5f6b; --warn: #e9b949;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    width: 320px; margin: 0; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  h1 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
  .sub { margin: 0 0 14px; font-size: 11.5px; color: var(--faint); }

  button {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: linear-gradient(135deg, var(--accent), #6a5ae0); color: #fff;
    font: 600 13px/1 inherit; cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .status {
    margin-top: 12px; padding: 10px 11px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--line);
    font-size: 12px; display: none;
  }
  .status.show { display: block; }
  .status.ok { border-color: #48c78e55; }
  .status.bad { border-color: #ef5f6b55; }
  .status .title { font-weight: 600; margin-bottom: 5px; display: flex; gap: 6px; align-items: center; }
  .status.ok .title { color: var(--ok); }
  .status.bad .title { color: var(--bad); }
  .status .line { color: var(--muted); font-size: 11.5px; }
  .status .line b { color: var(--text); font-family: var(--mono); font-weight: 500; }

  .rows { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 4px; }
  .row { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; }
  .row span { color: var(--faint); }
  .row b { color: var(--text); font-family: var(--mono); font-weight: 500;
           text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .cfg { margin-top: 12px; display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--faint); }
  .cfg input {
    width: 66px; padding: 5px 7px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    font: 11.5px/1 var(--mono);
  }
  .cfg a { color: var(--accent); text-decoration: none; margin-left: auto; }
  .cfg a:hover { text-decoration: underline; }

  .hint { margin-top: 10px; font-size: 11px; color: var(--faint); line-height: 1.55; }
  code { font-family: var(--mono); font-size: 10.5px; }
</style>

<h1>Gong Cookie Bridge</h1>
<p class="sub">Sends your signed-in session to the local puller.</p>

<button id="send">Send session to puller</button>

<div class="status" id="status"></div>

<div class="cfg">
  <label for="port">Port</label>
  <input type="number" id="port" min="1" max="65535" value="7878">
  <a href="#" id="open">Open puller</a>
</div>

<div class="hint" id="hint"></div>

<script src="popup.js"></script>
